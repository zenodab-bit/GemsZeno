[Simulation]

    # seed = 1234
    tickunit = 'd'
    GlobalSetting = false
    startdate = '2024-01-01'
    enddate = '2024-12-31'
    [Simulation.StartCondition]
        type = "InfectedFraction"
        [Simulation.StartCondition.parameters]
            fraction = 0.0001

    [Simulation.StopCriterion]
        type = "TimesUp"
        [Simulation.StopCriterion.parameters]
            limit = 365

[Population]
    n = 100_000
    avg_household_size = 3
    avg_office_size = 5
    avg_school_size = 100
    empty = false

[Pathogens]
    [Pathogens.Covid19]
        [Pathogens.Covid19.transmission_function]
            type = "ConstantTransmissionRate"
            [Pathogens.Covid19.transmission_function.parameters]
                transmission_rate = 0.065

        [Pathogens.Covid19.progressions]

            # ASYMPTOMATIC PROGRESSION
            [Pathogens.Covid19.progressions.Asymptomatic]
                # Derived: Incubation (5.869) - Infectious Offset (2.193) = 3.676
                [Pathogens.Covid19.progressions.Asymptomatic.exposure_to_infectiousness_onset]
                    distribution = "Poisson"
                    parameters = [3.676]
                # Source: Kheifetz "Infectious offset"
                [Pathogens.Covid19.progressions.Asymptomatic.infectiousness_onset_to_recovery]
                    distribution = "Poisson"
                    parameters = [5] # similar to mild

            # SYMPTOMATIC PROGRESSION
            [Pathogens.Covid19.progressions.Symptomatic]
                # Derived: Incubation (5.869) - Infectious Offset (2.193) = 3.676
                [Pathogens.Covid19.progressions.Symptomatic.exposure_to_infectiousness_onset]
                    distribution = "Poisson"
                    parameters = [3.676]
                # Source: Kheifetz "Infectious offset"
                [Pathogens.Covid19.progressions.Symptomatic.infectiousness_onset_to_symptom_onset]
                    distribution = "Poisson"
                    parameters = [2.193]
                # Source: Kheifetz "Time to recovery (Mild)"
                [Pathogens.Covid19.progressions.Symptomatic.symptom_onset_to_recovery]
                    distribution = "Poisson"
                    parameters = [3.171]

            # SEVERE PROGRESSION (Non-hospitalized)
            [Pathogens.Covid19.progressions.SevereWithDeath]
                death_probability = 0.05

                [Pathogens.Covid19.progressions.SevereWithDeath.exposure_to_infectiousness_onset]
                    distribution = "Poisson"
                    parameters = [3.676]
                [Pathogens.Covid19.progressions.SevereWithDeath.infectiousness_onset_to_symptom_onset]
                    distribution = "Poisson"
                    parameters = [2.193]
                # Source: Kheifetz "Time to severeness onset"
                [Pathogens.Covid19.progressions.SevereWithDeath.symptom_onset_to_severeness_onset]
                    distribution = "Poisson"
                    parameters = [5.376]
                [Pathogens.Covid19.progressions.SevereWithDeath.severeness_onset_to_severeness_offset]
                    distribution = "Poisson"
                    parameters = [14.0] # Est. part of the 19.9 remaining severe days
                [Pathogens.Covid19.progressions.SevereWithDeath.severeness_offset_to_recovery]
                    distribution = "Poisson"
                    parameters = [5.925] # Est. remainder to match total 25.301 days
                [Pathogens.Covid19.progressions.SevereWithDeath.severeness_onset_to_death]
                    distribution = "Poisson"
                    parameters = [14.0] 

            # source for hospital los: https://pmc.ncbi.nlm.nih.gov/articles/PMC7467845/
            # HOSPITALIZED PROGRESSION
            [Pathogens.Covid19.progressions.HospitalizedWithDeath]
                death_probability = 0.05

                [Pathogens.Covid19.progressions.HospitalizedWithDeath.exposure_to_infectiousness_onset]
                    distribution = "Poisson"
                    parameters = [3.676]
                [Pathogens.Covid19.progressions.HospitalizedWithDeath.infectiousness_onset_to_symptom_onset]
                    distribution = "Poisson"
                    parameters = [2.193]
                # Source: Kheifetz "Time to severeness onset"
                [Pathogens.Covid19.progressions.HospitalizedWithDeath.symptom_onset_to_severeness_onset]
                    distribution = "Poisson"
                    parameters = [5.376]
                # Keeping default 2 days from severeness to admission.
                [Pathogens.Covid19.progressions.HospitalizedWithDeath.severeness_onset_to_hospital_admission]
                    distribution = "Poisson"
                    parameters = [4]
                # Derived: Matches "Time to recovery (Severe)" total duration logic
                [Pathogens.Covid19.progressions.HospitalizedWithDeath.hospital_admission_to_hospital_discharge]
                    distribution = "Poisson"
                    parameters = [5] 
                [Pathogens.Covid19.progressions.HospitalizedWithDeath.hospital_discharge_to_severeness_offset]
                    distribution = "Poisson"
                    parameters = [5]
                [Pathogens.Covid19.progressions.HospitalizedWithDeath.severeness_offset_to_recovery]
                    distribution = "Poisson"
                    parameters = [3]
                [Pathogens.Covid19.progressions.HospitalizedWithDeath.hospital_admission_to_death]
                    distribution = "Poisson"
                    parameters = [5]

            # CRITICAL PROGRESSION
            [Pathogens.Covid19.progressions.Critical]
                # Source: Kheifetz "Death rate with critical progression" = 10.4%
                death_probability = 0.104
                
                [Pathogens.Covid19.progressions.Critical.exposure_to_infectiousness_onset]
                    distribution = "Poisson"
                    parameters = [3.676]
                [Pathogens.Covid19.progressions.Critical.infectiousness_onset_to_symptom_onset]
                    distribution = "Poisson"
                    parameters = [2.193]
                [Pathogens.Covid19.progressions.Critical.symptom_onset_to_severeness_onset]
                    distribution = "Poisson"
                    parameters = [5.376]
                [Pathogens.Covid19.progressions.Critical.severeness_onset_to_hospital_admission]
                    distribution = "Poisson"
                    parameters = [2]
                [Pathogens.Covid19.progressions.Critical.hospital_admission_to_icu_admission]
                    distribution = "Poisson"
                    parameters = [2]
                
                # RECOVERY PATHWAY
                [Pathogens.Covid19.progressions.Critical.icu_admission_to_icu_discharge]
                    distribution = "Poisson"
                    parameters = [7]
                [Pathogens.Covid19.progressions.Critical.icu_discharge_to_hospital_discharge]
                    distribution = "Poisson"
                    parameters = [4]
                [Pathogens.Covid19.progressions.Critical.hospital_discharge_to_severeness_offset]
                    distribution = "Poisson"
                    parameters = [3]
                [Pathogens.Covid19.progressions.Critical.severeness_offset_to_recovery]
                    distribution = "Poisson"
                    parameters = [4]

                # DEATH PATHWAY
                [Pathogens.Covid19.progressions.Critical.icu_admission_to_death]
                    distribution = "Poisson"
                    parameters = [7]

        # PROGRESSION ASSIGNMENT
        [Pathogens.Covid19.progression_assignment]
            type = "AgeBasedProgressionAssignment"
            [Pathogens.Covid19.progression_assignment.parameters]
                # Updated Age Groups from Image
                age_groups = ["-39", "40-59", "60-79", "80-"]
                
                # assumed that 30% of severe requires hospitalization
                progression_categories = ["Asymptomatic", "Symptomatic", "SevereWithDeath", "HospitalizedWithDeath", "Critical"]
                
                stratification_matrix = [
                    [0.450, 0.538, 0.007, 0.003, 0.002], # 0-40
                    [0.300, 0.644, 0.031, 0.013, 0.012], # 40-60
                    [0.200, 0.546, 0.120, 0.051, 0.083], # 60-80
                    [0.150, 0.353, 0.212, 0.091, 0.194]  # 80+
                ]
[Settings]

    [Settings.Household]
        [Settings.Household.contact_sampling_method]
                type = "ContactparameterSampling"

                [Settings.Household.contact_sampling_method.parameters]
                    contactparameter = 2.62

    [Settings.Office]
        [Settings.Office.contact_sampling_method]
                type = "ContactparameterSampling"

                [Settings.Office.contact_sampling_method.parameters]
                    contactparameter = 2.445

    [Settings.Department]
        [Settings.Department.contact_sampling_method]
                type = "ContactparameterSampling"

                [Settings.Department.contact_sampling_method.parameters]
                    contactparameter = 0.489

    [Settings.Workplace]
        [Settings.Workplace.contact_sampling_method]
                type = "ContactparameterSampling"

                [Settings.Workplace.contact_sampling_method.parameters]
                    contactparameter = 0.326

    [Settings.WorkplaceSite]
        [Settings.WorkplaceSite.contact_sampling_method]
                type = "ContactparameterSampling"

                [Settings.WorkplaceSite.contact_sampling_method.parameters]
                    contactparameter = 0

    [Settings.SchoolClass]
        [Settings.SchoolClass.contact_sampling_method]
                type = "ContactparameterSampling"

                [Settings.SchoolClass.contact_sampling_method.parameters]
                    contactparameter = 4.62

    [Settings.SchoolYear]
        [Settings.SchoolYear.contact_sampling_method]
                type = "ContactparameterSampling"

                [Settings.SchoolYear.contact_sampling_method.parameters]
                    contactparameter = 0.924

    [Settings.School]
        [Settings.School.contact_sampling_method]
                type = "ContactparameterSampling"

                [Settings.School.contact_sampling_method.parameters]
                    contactparameter = 0.616

    [Settings.SchoolComplex]
        [Settings.SchoolComplex.contact_sampling_method]
                type = "ContactparameterSampling"

                [Settings.SchoolComplex.contact_sampling_method.parameters]
                    contactparameter = 0

    [Settings.Municipality]
        [Settings.Municipality.contact_sampling_method]
                type = "ContactparameterSampling"

                [Settings.Municipality.contact_sampling_method.parameters]
                    contactparameter =  2.29
                    
    [Settings.GlobalSetting]
        [Settings.GlobalSetting.contact_sampling_method]
                type = "ContactparameterSampling"
                
                [Settings.GlobalSetting.contact_sampling_method.parameters]
                    contactparameter = 0